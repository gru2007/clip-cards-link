<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ваш UDID</title>
  <style>
    :root {
      --blue: #007AFF;
      --green: #34C759;
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --code-bg: #f0f0f5;
      --border: rgba(0,0,0,0.08);
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --card: #2c2c2e;
        --text: #f5f5f7;
        --muted: #aeaeb2;
        --code-bg: #3a3a3c;
        --border: rgba(255,255,255,0.08);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* ── Success card ── */
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.10);
      padding: 36px 28px 28px;
      text-align: center;
    }

    .badge {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--green);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .badge svg { width: 32px; height: 32px; stroke: #fff; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; }
    .subtitle { color: var(--muted); font-size: 0.88rem; margin-bottom: 24px; }

    /* ── UDID field ── */
    .udid-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      text-align: left;
      margin-bottom: 6px;
    }
    .udid-box {
      background: var(--code-bg);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .udid-value {
      font-family: "SF Mono", "Fira Mono", "Consolas", monospace;
      font-size: 0.88rem;
      word-break: break-all;
      flex: 1;
      text-align: left;
      line-height: 1.5;
      color: var(--text);
    }
    .copy-btn {
      appearance: none;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 4px;
      color: var(--blue);
      flex-shrink: 0;
      border-radius: 6px;
      transition: opacity 0.15s;
    }
    .copy-btn:active { opacity: 0.5; }
    .copy-btn svg { display: block; width: 22px; height: 22px; }

    /* ── Extra info table ── */
    .info-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.83rem;
      margin-bottom: 20px;
      text-align: left;
    }
    .info-table tr { border-bottom: 1px solid var(--border); }
    .info-table tr:last-child { border-bottom: none; }
    .info-table td { padding: 8px 4px; }
    .info-table td:first-child { color: var(--muted); width: 42%; }
    .info-table td:last-child { font-weight: 500; word-break: break-all; }

    /* ── Action buttons ── */
    .actions { display: flex; flex-direction: column; gap: 10px; }
    .btn {
      display: block;
      padding: 14px;
      border-radius: 13px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
      transition: opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { opacity: 0.7; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-secondary {
      background: var(--code-bg);
      color: var(--text);
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1d1d1f;
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 500;
      transition: transform 0.25s ease, opacity 0.25s ease;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* ── Error state ── */
    .error-card {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.10);
      padding: 36px 28px;
      text-align: center;
    }
    .error-icon { font-size: 3rem; margin-bottom: 12px; }
    .error-card h1 { margin-bottom: 10px; }
    .error-card p { color: var(--muted); font-size: 0.9rem; line-height: 1.5; margin-bottom: 20px; }
  </style>
</head>
<body>

  <!-- Success state (shown when ?udid= present) -->
  <div class="card" id="successCard" style="display:none">
    <div class="badge">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1>UDID получен</h1>
    <p class="subtitle">Профиль можно удалить: Настройки → Основные → VPN и управление устройством.</p>

    <div class="udid-label">UDID</div>
    <div class="udid-box">
      <span class="udid-value" id="udidValue">—</span>
      <button class="copy-btn" id="copyUdid" title="Скопировать UDID" aria-label="Скопировать UDID">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
      </button>
    </div>

    <table class="info-table" id="infoTable"></table>

    <div class="actions">
      <button class="btn btn-primary" id="copyAll">Скопировать UDID</button>
      <a href="index.html" class="btn btn-secondary">На главную</a>
    </div>
  </div>

  <!-- Error state (shown when no udid param) -->
  <div class="error-card" id="errorCard" style="display:none">
    <div class="error-icon">⚠️</div>
    <h1>UDID не найден</h1>
    <p>
      Возможно, вы открыли эту страницу напрямую.<br>
      Чтобы получить UDID, установите профиль конфигурации.
    </p>
    <a href="index.html" class="btn btn-primary">Вернуться</a>
  </div>

  <div class="toast" id="toast">Скопировано!</div>

  <script>
    (() => {
      const params = new URLSearchParams(location.search);

      // Field display names
      const LABELS = {
        udid:    'UDID',
        product: 'Модель',
        version: 'Версия ОС',
        serial:  'Серийный номер',
        imei:    'IMEI',
        iccid:   'ICCID',
      };

      const udid = params.get('udid') || params.get('UDID');

      if (!udid) {
        document.getElementById('errorCard').style.display = '';
        return;
      }

      document.getElementById('successCard').style.display = '';
      document.getElementById('udidValue').textContent = udid;

      // Build extra info table from remaining params
      const table = document.getElementById('infoTable');
      const extraKeys = ['product','version','serial','imei','iccid'];
      extraKeys.forEach(key => {
        const val = params.get(key) || params.get(key.toUpperCase());
        if (val) {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${LABELS[key] || key}</td><td>${escHtml(val)}</td>`;
          table.appendChild(tr);
        }
      });

      // Copy helpers
      function escHtml(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); } catch {}
          document.body.removeChild(ta);
        }
      }

      let toastTimer;
      function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
      }

      document.getElementById('copyUdid').addEventListener('click', async () => {
        await copyText(udid);
        showToast('UDID скопирован!');
      });

      document.getElementById('copyAll').addEventListener('click', async () => {
        await copyText(udid);
        showToast('UDID скопирован!');
      });
    })();
  </script>
</body>
</html>
